<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Погода v5</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        #clock {
            font-size: 70px;
            font-weight: 200;
            margin-bottom: 20px;
            color: #aaaaaa;
        }
        #temp {
            font-size: 160px;
            font-weight: 300;
            line-height: 1;
            margin: 10px 0;
        }
        #desc {
            font-size: 42px;
            color: #dddddd;
            margin-bottom: 30px;
        }
        #details {
            font-size: 28px;
            color: #888888;
        }
    </style>
</head>
<body>

    <div id="clock">00:00</div>
    <div id="temp">--°</div>
    <div id="desc">Завантаження v5...</div>
    <div id="details">Вологість: --%</div>

    <script>
        // Координати для Сум
        var lat = 50.9077;
        var lon = 34.7981;

        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            if (hours < 10) hours = '0' + hours;
            if (minutes < 10) minutes = '0' + minutes;
            document.getElementById('clock').innerHTML = hours + ':' + minutes;
        }

        function translateWeather(w) {
            if (!w) return 'Хмарно';
            if (w.indexOf('clear') !== -1) return 'Ясно';
            if (w.indexOf('pcloudy') !== -1 || w.indexOf('mcloudy') !== -1) return 'Мінлива хмарність';
            if (w.indexOf('cloudy') !== -1) return 'Хмарно';
            if (w.indexOf('humid') !== -1) return 'Туман / Волого';
            if (w.indexOf('lightrain') !== -1) return 'Невеликий дощ';
            if (w.indexOf('rain') !== -1) return 'Дощ';
            if (w.indexOf('snow') !== -1) return 'Сніг';
            if (w.indexOf('ts') !== -1) return 'Гроза';
            return 'Хмарно';
        }

        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            var url = 'https://7timer.info' + lon + '&lat=' + lat + '&ac=0&unit=metric&output=json&tzshift=0';
            
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var current = data.dataseries[0];
                            var temp = Math.round(current.temp2m);
                            var sign = temp > 0 ? '+' : '';
                            var desc = translateWeather(current.weather);
                            var humidity = current.rh2m;

                            document.getElementById('temp').innerHTML = sign + temp + '°';
                            document.getElementById('desc').innerHTML = desc;
                            document.getElementById('details').innerHTML = 'Вологість: ' + humidity;
                        } catch (e) {
                            document.getElementById('desc').innerHTML = 'Помилка даних: ' + e.message;
                        }
                    } else {
                        document.getElementById('desc').innerHTML = 'Помилка мережі: ' + xhr.status;
                    }
                }
            };
            xhr.send();
        }

        updateClock();
        setInterval(updateClock, 10000);

        fetchWeather();
        setInterval(fetchWeather, 900000);
    </script>
</body>
</html>
