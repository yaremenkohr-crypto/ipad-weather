<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Погода iPad</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        #clock {
            font-size: 70px;
            font-weight: 200;
            margin-bottom: 20px;
            color: #aaaaaa;
        }
        #temp {
            font-size: 160px;
            font-weight: 300;
            line-height: 1;
            margin: 10px 0;
        }
        #desc {
            font-size: 42px;
            color: #dddddd;
            margin-bottom: 30px;
            text-transform: capitalize;
        }
        #details {
            font-size: 28px;
            color: #888888;
        }
    </style>
</head>
<body>

    <div id="clock">00:00</div>
    <div id="temp">--°</div>
    <div id="desc">Завантаження...</div>
    <div id="details">Вітер: -- м/с</div>

    <script>
        var apiKey = 'c4365ef1c19e871a99553ab9f3cef6eb';
        var lat = 50.9077;
        var lon = 34.7981;

        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            if (hours < 10) hours = '0' + hours;
            if (minutes < 10) minutes = '0' + minutes;
            document.getElementById('clock').innerHTML = hours + ':' + minutes;
        }

        function fetchWeather() {
            var url = 'https://openweathermap.org' + lat + '&lon=' + lon + '&appid=' + apiKey + '&units=metric&lang=uk';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var temp = Math.round(data.main.temp);
                            var sign = temp > 0 ? '+' : '';
                            var desc = data.weather[0].description;
                            var wind = Math.round(data.wind.speed);
                            var humidity = data.main.humidity;

                            document.getElementById('temp').innerHTML = sign + temp + '°';
                            document.getElementById('desc').innerHTML = desc;
                            document.getElementById('details').innerHTML = 'Вітер: ' + wind + ' м/с &nbsp;•&nbsp; Вологість: ' + humidity + '%';
                        } catch (e) {
                            document.getElementById('desc').innerHTML = 'Помилка даних';
                        }
                    } else if (xhr.status === 401) {
                        document.getElementById('desc').innerHTML = 'Ключ ще активується (зачекайте 10 хв)';
                    } else {
                        document.getElementById('desc').innerHTML = 'Помилка сервера: ' + xhr.status;
                    }
                }
            };
            xhr.send();
        }

        updateClock();
        setInterval(updateClock, 10000);

        fetchWeather();
        setInterval(fetchWeather, 900000);
    </script>
</body>
</html>
